services:
  - type: web
    name: traceforge
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMMA_THINKING_LEVEL
        value: high
      - key: CORS_ORIGIN
        value: "*"
